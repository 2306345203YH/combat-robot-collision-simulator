name: wqmn
services:
  collision-lab:
    build:
      context: .
      dockerfile: Dockerfile
    image: robot-collision-lab:local
    restart: unless-stopped
    ports:
      - "${LAB_BIND_ADDRESS:-0.0.0.0}:${LAB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
